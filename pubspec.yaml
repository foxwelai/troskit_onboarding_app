name: troskit_onboarding_app
description: Troskit employee app — onboard shops and catalog products.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  mobile_scanner: ^7.2.0
  audioplayers: ^6.8.1
  geolocator: ^13.0.2
  path_provider: ^2.1.6
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - google_fonts/
    - assets/logos/
    - assets/images/
    - assets/sounds/store-beep.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/troskit-logo2.png"
  min_sdk_android: 21
  remove_alpha_ios: true
